<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream JS</title>
</head>

<body>
    <script type="module">
        import Dream from "./dream.js";

        import Components from './dream/components.js';
        const { HoloCard, HoloButton } = Components.HoloLibrary;
        
        // import { HoloCard } from "./components/HoloCard.js"; // Direct Use
        // import { HoloButton } from "./components/HoloButton.js"; // Direct Use

        const [getConnected, setConnected] = Dream.useState(true);

        const View = () => HoloCard({
            children: [
                {
                    el: "h2",
                    content: "Welcome"
                },
                getConnected() ? HoloButton({
                    id: "connect",
                    text: "Connect Wallet"
                }) : null
            ]
        });

        const App = () => {

            const connectWallet = () => {
                setConnected(false);
                // cleanup first;
                document.getElementById("connect")?.removeEventListener("click", connectWallet);

                alert("Connected!");
                // Render On Update
                Dream.update({
                    el: "app",
                    node: HoloCard({
                        children: [
                            {
                                el: "h2",
                                content: "Welcome"
                            },
                        ]
                    })
                }, App);
            };

            if (getConnected()) {
                document
                    .getElementById("connect")
                    ?.addEventListener(
                        "click",
                        connectWallet
                    );
            }
        };

        Dream.onReady({
            el: "app",
            node: View()
        }, App);
    </script>
</body>

</html>
